<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>EssentialEngine 管理面板</title>
<style>
/* ============================================================
   EssentialEngine 管理面板
   风格：iOS 浅色（设置 / 健康那一套）

   刻意<b>不</b>做「彩虹色斑 + 全屏磨砂」的通用玻璃拟态——那是最套路的做法，
   而且真正的 iOS 浅色界面根本不长那样：背景是干净的中性分组灰，卡片是纯白，
   颜色只出现在语义位置（状态、图标），撑起质感的是排版层级和留白。
   半透明模糊只保留在它本该出现的地方：侧边栏与浮层。

   全部资源内联，不引用任何外部 CDN（服务器通常没有外网出口，
   且面板的 CSP 是 default-src 'self'）
   ============================================================ */

:root{
  --font-ui: "SF Pro Display", -apple-system, BlinkMacSystemFont, "Segoe UI Variable Display",
             "Segoe UI", "PingFang SC", "Microsoft YaHei UI", "Noto Sans SC", sans-serif;
  --font-mono: "SF Mono", ui-monospace, "Cascadia Mono", "JetBrains Mono", Consolas, monospace;

  /* iOS 浅色模式的系统色 */
  --accent: #007AFF;
  --accent-2: #34C759;
  --danger: #FF3B30;
  --warn: #FF9500;

  /* iOS systemGroupedBackground 与卡片 */
  --bg: #F2F2F7;
  --card: #FFFFFF;
  --text: #000000;
  --text-2: rgba(60,60,67,.60);
  --text-3: rgba(60,60,67,.32);
  --hairline: rgba(60,60,67,.13);
  --field: #F2F2F7;
  --track: rgba(120,120,128,.16);
  --tint: rgba(0,122,255,.10);
  --shadow: 0 1px 2px rgba(0,0,0,.04), 0 8px 24px rgba(0,0,0,.05);

  --radius-xl: 26px;
  --radius-lg: 18px;
  --radius-md: 12px;
  --radius-sm: 9px;

  /* iOS 的弹性缓动 */
  --spring: cubic-bezier(.32,.72,0,1);
}

*{ box-sizing:border-box; margin:0; padding:0; }
/* 作者样式里的 display 会盖掉 [hidden] 的默认 display:none，这里补回来 */
[hidden]{ display:none !important; }
html,body{ height:100%; }
body{
  font-family: var(--font-ui);
  background: var(--bg);
  color: var(--text);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  overflow-x: hidden;
}

/* 顶部一层极淡的冷色渐变，让大片留白不至于发死；不喧宾夺主 */
.aurora{
  position:fixed; inset:0; z-index:-1; pointer-events:none;
  background:
    radial-gradient(120% 62% at 12% -12%, rgba(0,122,255,.09), transparent 62%),
    radial-gradient(90% 52% at 92% 2%, rgba(175,82,222,.06), transparent 60%);
}
.aurora i{ display:none; }

/* ---- 卡片基类 ----
   名字沿用 .glass（JS 里在用），但现在是不透明白卡片：
   iOS 的层次靠的是极轻的投影 + 大圆角，而不是把所有东西都做成毛玻璃 */
.glass{
  background: var(--card);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow);
}

/* 真正需要「玻璃」的地方：侧边栏与浮层 */
.frosted{
  background: rgba(255,255,255,.72);
  backdrop-filter: saturate(180%) blur(20px);
  -webkit-backdrop-filter: saturate(180%) blur(20px);
}

/* ---- 图标 ----
   刻意<b>不</b>用 iOS 设置那种「每项一个彩色圆角块」：全站只有蓝色一个强调色，
   一排饱和色块会和其它部分打架。这里统一成单色描边图标——默认灰、选中变蓝，
   和按钮、开关、选中态用的是同一套语言。 */
.sq{
  width:22px; height:22px; flex:none;
  display:grid; place-items:center;
  color:var(--text-3);
  transition:color .18s;
}
.sq svg{ width:20px; height:20px; }
svg{ stroke:currentColor; fill:none; stroke-width:1.9; stroke-linecap:round; stroke-linejoin:round; }

/* ============================ 登录 ============================ */
#login{
  min-height:100dvh; display:grid; place-items:center; padding:24px;
}
.login-card{
  width:min(400px,100%); padding:40px 34px 34px;
  border-radius: var(--radius-xl);
  animation: rise .7s var(--spring) both;
}
@keyframes rise{ from{ opacity:0; transform:translateY(22px) scale(.97);} }
/* logo 由 /logo.png 提供（同源静态资源，符合 CSP 的 img-src 'self'）。
   图片自带底色，所以这里只负责圆角和投影，不再画背景。 */
.mark{
  width:64px; height:64px; border-radius:15px; margin:0 auto 16px;
  display:block; object-fit:cover;
  box-shadow:0 6px 18px rgba(0,0,0,.16);
}
.login-card .lead{ font-size:15px; color:var(--text-2); text-align:center; margin:0 0 24px; }
.login-card p{ text-align:center; }
/* 两种登录方式之间的分隔线 */
.sep{ display:flex; align-items:center; gap:12px; margin:16px 0;
  font-size:12.5px; color:var(--text-3); }
.sep::before,.sep::after{ content:""; flex:1; height:1px; background:var(--hairline); }
.btn.oauth{ display:flex; align-items:center; justify-content:center; gap:9px;
  background:rgba(120,120,128,.12); color:var(--text); }
.btn.oauth svg{ width:19px; height:19px; color:var(--accent); }

/* ============================ 布局 ============================ */
#app{ display:none; min-height:100dvh; }
#app.on{ display:grid; grid-template-columns:250px 1fr; }
@media (max-width:900px){ #app.on{ grid-template-columns:1fr; } }

aside{
  position:sticky; top:0; align-self:start; height:100dvh; padding:22px 14px;
  display:flex; flex-direction:column;
  border-right:1px solid var(--hairline);
}
@media (max-width:900px){
  aside{ position:static; height:auto; border-right:0; border-bottom:1px solid var(--hairline); }
}
.brand{ display:flex; align-items:center; gap:10px; padding:2px 10px 22px; }
.brand .mark{ width:30px; height:30px; border-radius:7px; margin:0; box-shadow:none; }
.brand b{ font-size:15px; font-weight:600; letter-spacing:-.2px; display:block; }
.brand span{ display:block; font-size:11.5px; color:var(--text-3); }

nav{ display:flex; flex-direction:column; gap:2px; }
@media (max-width:900px){ nav{ flex-direction:row; overflow-x:auto; padding-bottom:2px; } }
.tab{
  display:flex; align-items:center; gap:11px; width:100%;
  padding:7px 10px; border:0; border-radius:9px;
  background:transparent; color:var(--text); font:inherit; font-size:15px; font-weight:400;
  cursor:pointer; text-align:left; white-space:nowrap;
  transition: background .18s;
}
.tab:hover{ background:rgba(60,60,67,.05); }
.tab:hover .sq{ color:var(--text-2); }
.tab[aria-selected="true"]{ background:var(--tint); color:var(--accent); font-weight:590; }
.tab[aria-selected="true"] .sq{ color:var(--accent); }

main{ min-width:0; display:flex; flex-direction:column; gap:20px;
  padding:34px clamp(20px,4vw,44px) 48px; }

.view{ display:none; flex-direction:column; gap:20px; }
.view.on{ display:flex; animation: fade .4s var(--spring) both; }
@keyframes fade{ from{ opacity:0; transform:translateY(8px);} }

/* iOS 的 Large Title：字号大、字重重、字距收紧 */
.head{ display:flex; align-items:flex-end; justify-content:space-between; gap:16px; flex-wrap:wrap; }
.head h2{ font-size:34px; font-weight:700; letter-spacing:-.9px; line-height:1.1; }
.head p{ font-size:14px; color:var(--text-2); margin-top:5px; }

/* 分组标题：iOS 分组列表上方那行小灰字 */
.panel > h3, .grp > header b{
  font-size:13px; font-weight:600; color:var(--text-2);
  letter-spacing:.2px;
}

/* ============================ 组件 ============================ */
.btn{
  border:0; border-radius:10px; padding:8px 16px; font:inherit; font-size:15px; font-weight:510;
  background:rgba(120,120,128,.12); color:var(--accent); cursor:pointer;
  transition: transform .18s var(--spring), background .18s, opacity .18s;
}
.btn:hover{ background:rgba(120,120,128,.18); }
.btn:active{ transform:scale(.96); }
.btn[disabled]{ opacity:.4; cursor:default; transform:none; }
.btn.primary{ background:var(--accent); color:#fff; }
.btn.primary:hover{ background:#0069DB; }
.btn.danger{ background:rgba(255,59,48,.11); color:var(--danger); }
.btn.danger:hover{ background:rgba(255,59,48,.18); }
.btn.sm{ padding:5px 12px; font-size:13px; border-radius:8px; }
.btn.wide{ width:100%; padding:13px; font-size:16px; font-weight:590; }

input,textarea,select{
  width:100%; font:inherit; font-size:15px; color:var(--text);
  background:var(--field); border:0; border-radius:10px; padding:11px 14px;
  box-shadow: inset 0 0 0 1px transparent;
  transition: box-shadow .2s, background .2s;
}
input:focus,textarea:focus,select:focus{ outline:0; background:#fff;
  box-shadow: inset 0 0 0 1.5px var(--accent), 0 0 0 4px rgba(0,122,255,.13); }
input.bad{ background:#fff;
  box-shadow: inset 0 0 0 1.5px var(--danger), 0 0 0 4px rgba(255,59,48,.13); }
textarea{ resize:vertical; min-height:76px; font-family:var(--font-mono); font-size:13px; }
::placeholder{ color:var(--text-3); }

/* ---- 抹掉各家浏览器塞进来的原生控件外观 ----
   数字框的上下箭头、密码框的小眼睛、自动填充的黄底，
   这些默认样式和整体质感冲突，全部覆盖掉。 */
input[type=number]{ -moz-appearance:textfield; appearance:textfield; }
input[type=number]::-webkit-outer-spin-button,
input[type=number]::-webkit-inner-spin-button{ -webkit-appearance:none; margin:0; }
input[type=password]::-ms-reveal,
input[type=password]::-ms-clear{ display:none; }
input:-webkit-autofill,
input:-webkit-autofill:hover,
input:-webkit-autofill:focus{
  -webkit-text-fill-color: var(--text);
  -webkit-box-shadow: inset 0 0 0 1px var(--hairline), inset 0 0 0 100px #fff;
  caret-color: var(--text);
}
::selection{ background:rgba(0,122,255,.20); }
:focus-visible{ outline:none; }
*{ scrollbar-width:thin; scrollbar-color:var(--track) transparent; }

/* iOS 开关 */
.sw{ flex:none; width:51px; height:31px; border-radius:100px; border:0; padding:0; cursor:pointer;
  background:var(--track); position:relative;
  transition: background .3s var(--spring); }
.sw::after{ content:""; position:absolute; top:2px; left:2px; width:27px; height:27px; border-radius:50%;
  background:#fff; box-shadow:0 3px 8px rgba(0,0,0,.15),0 1px 1px rgba(0,0,0,.16);
  transition: transform .3s var(--spring); }
.sw[data-on="true"]{ background:var(--accent-2); }
.sw[data-on="true"]::after{ transform:translateX(20px); }

.chip{ display:inline-flex; align-items:center; gap:5px; padding:3px 9px; border-radius:100px;
  font-size:12px; font-weight:510; background:rgba(120,120,128,.12); color:var(--text-2); }
.chip.good{ color:#248A3D; background:rgba(52,199,89,.15); }
.chip.bad{ color:#D70015; background:rgba(255,59,48,.13); }
.chip.warn{ color:#B25000; background:rgba(255,149,0,.16); }

/* ============================ 概览 ============================ */
.tiles{ display:grid; grid-template-columns:repeat(auto-fit,minmax(176px,1fr)); gap:14px; }
.tile{ padding:16px 18px 18px; }
.tile .k{ font-size:13px; color:var(--text-2); font-weight:400; }
/* 数字用等宽字形，刷新时不会左右跳动 */
.tile .v{ font-size:32px; font-weight:640; letter-spacing:-1px; margin-top:8px;
  font-variant-numeric:tabular-nums; line-height:1.05; }
.tile .s{ font-size:12px; color:var(--text-3); margin-top:4px; }

.panel{ padding:18px 20px 20px; }
.panel > h3{ margin-bottom:14px; }

.mods{ display:grid; grid-template-columns:repeat(auto-fill,minmax(196px,1fr)); gap:9px; }
.mod{ display:flex; align-items:center; justify-content:space-between; gap:10px;
  padding:11px 13px; border-radius:11px; background:var(--field); }
.mod > div{ min-width:0; }
.mod b{ font-size:14px; font-weight:500; display:block;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.mod small{ font-size:11.5px; color:var(--text-3); font-family:var(--font-mono); }
.mod .chip{ flex:none; white-space:nowrap; }

/* ============================ 配置 ============================ */
/* iOS 分组列表：标题在卡片外面，分隔线从左侧内缩 */
.grp{ padding:0; overflow:hidden; }
.grp > header{ padding:16px 18px 10px; }
.grp > header b{ font-family:var(--font-mono); color:var(--text-2); }
.grp > header p{ font-size:12.5px; color:var(--text-3); margin-top:6px;
  white-space:pre-line; line-height:1.5; }
.row{ display:flex; align-items:center; gap:16px; padding:11px 18px; position:relative; }
.row::before{ content:""; position:absolute; top:0; left:18px; right:0;
  height:1px; background:var(--hairline); }
.row:first-of-type::before{ display:none; }
.row .lbl{ flex:1; min-width:0; }
.row .lbl b{ font-size:15px; font-weight:400; display:block; }
.row .lbl p{ font-size:12px; color:var(--text-3); margin-top:2px;
  white-space:pre-line; line-height:1.45; }
.row .ctl{ flex:none; width:min(260px,44%); }
.row.stack{ flex-direction:column; align-items:stretch; gap:9px; }
.row.stack .ctl{ width:100%; }

/* 底部悬浮保存条 */
.savebar{
  position:sticky; bottom:16px; z-index:5; margin-top:6px;
  display:flex; align-items:center; justify-content:space-between; gap:14px;
  padding:11px 12px 11px 18px; border-radius:14px;
  background:rgba(255,255,255,.82);
  backdrop-filter:saturate(180%) blur(20px); -webkit-backdrop-filter:saturate(180%) blur(20px);
  box-shadow:0 6px 24px rgba(0,0,0,.12);
  transform:translateY(160%); transition:transform .42s var(--spring);
}
.savebar.on{ transform:none; }
.savebar b{ font-size:14px; font-weight:510; }

/* ============================ 玩家 ============================ */
.plist{ display:grid; gap:11px; }
.pcard{ padding:15px 18px; display:flex; align-items:center; gap:16px; flex-wrap:wrap; }
.pcard .who{ flex:1 1 260px; min-width:0; }
.pcard .who b{ font-size:17px; font-weight:590; letter-spacing:-.3px; }
.pcard .meta{ display:flex; gap:6px; flex-wrap:wrap; margin-top:8px; }
.pcard .acts{ display:flex; gap:7px; flex-wrap:wrap; }
.pcard.tap{ cursor:pointer; transition:transform .18s var(--spring), box-shadow .18s; }
.pcard.tap:hover{ transform:translateY(-1px); box-shadow:0 4px 18px rgba(0,0,0,.09); }
.pcard.tap:active{ transform:scale(.995); }

/* iOS 搜索框：左侧放大镜、右侧一键清空 */
.search{ position:relative; display:flex; align-items:center; }
.search svg{ position:absolute; left:12px; width:16px; height:16px; color:var(--text-3);
  pointer-events:none; }
.search input{ padding-left:36px; padding-right:36px; }
.search .clr{ position:absolute; right:9px; width:20px; height:20px; border:0; padding:0;
  border-radius:50%; background:var(--track); color:#fff; cursor:pointer; display:none;
  align-items:center; justify-content:center; font-size:13px; line-height:1; }
.search.has .clr{ display:flex; }
.sub{ font-size:12.5px; color:var(--text-3); margin:10px 2px 0; }

/* ---- 玩家详情抽屉 ----
   在线列表放得下的信息有限，而离线玩家的封禁状态、流水这些才是管理时真正要看的。
   用从右侧滑出的抽屉：不打断列表，也不用跳页面。窄屏改成从底部升起，
   贴合手机上的 sheet 习惯。 */
#sheet{ position:fixed; inset:0; z-index:80; display:none; }
#sheet.on{ display:block; }
#sheet .scrim{ position:absolute; inset:0; background:rgba(0,0,0,.26);
  opacity:0; transition:opacity .34s var(--spring); }
#sheet.in .scrim{ opacity:1; }
.sheet-card{
  position:absolute; top:0; right:0; bottom:0; width:min(470px,100%);
  background:var(--bg); display:flex; flex-direction:column;
  box-shadow:-10px 0 46px rgba(0,0,0,.17);
  transform:translateX(100%); transition:transform .4s var(--spring);
}
#sheet.in .sheet-card{ transform:none; }
.sheet-top{
  flex:none; display:flex; align-items:center; gap:12px; padding:16px 18px;
  background:rgba(255,255,255,.86);
  backdrop-filter:saturate(180%) blur(20px); -webkit-backdrop-filter:saturate(180%) blur(20px);
  box-shadow: inset 0 -1px 0 var(--hairline);
}
.sheet-top .id{ flex:1; min-width:0; }
.sheet-top .id b{ font-size:19px; font-weight:640; letter-spacing:-.4px; display:block;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.sheet-top .id .meta{ display:flex; gap:6px; flex-wrap:wrap; margin-top:6px; }
.sheet-x{ flex:none; width:30px; height:30px; border:0; border-radius:50%; cursor:pointer;
  background:var(--track); color:var(--text-2); font-size:15px; line-height:1;
  display:grid; place-items:center; }
.sheet-x:hover{ background:rgba(120,120,128,.26); }
/* minmax(0,1fr) 不能省：默认的 auto 列会被 UUID 这种不可断行的长串
   撑到 max-content，整个抽屉跟着横向溢出。 */
.sheet-body{ flex:1; overflow-y:auto; padding:18px; display:grid; gap:16px;
  grid-template-columns:minmax(0,1fr); align-content:start; }
.sheet-body h4{ font-size:12.5px; font-weight:590; color:var(--text-2);
  text-transform:uppercase; letter-spacing:.04em; margin:0 4px 8px; }

/* 详情里的信息表：左标签右值，值用等宽数字 */
.kv{ background:var(--card); border-radius:var(--radius-md); overflow:hidden;
  box-shadow:var(--shadow); }
.kv .r{ display:flex; align-items:center; gap:14px; padding:11px 15px; position:relative;
  font-size:14.5px; }
.kv .r::before{ content:""; position:absolute; top:0; left:15px; right:0; height:1px;
  background:var(--hairline); }
.kv .r:first-child::before{ display:none; }
.kv .r .k{ flex:1; min-width:0; color:var(--text-2); font-weight:400; }
.kv .r .v{ flex:none; min-width:0; max-width:62%; text-align:right; font-weight:510;
  font-variant-numeric:tabular-nums; overflow:hidden; text-overflow:ellipsis;
  white-space:nowrap; }
.kv .r .v.bad{ color:var(--danger); }
/* UUID 这类长值截断了等于没显示，改成上下排列、整串折行 */
.kv .r.col{ flex-direction:column; align-items:stretch; gap:3px; }
.kv .r.col .v{ max-width:100%; text-align:left; white-space:normal; word-break:break-all;
  font-family:var(--font-mono); font-size:12px; font-weight:400; color:var(--text-2); }
.sheet-acts{ display:flex; gap:7px; flex-wrap:wrap; }
/* 抽屉比经济页窄得多，流水行沿用那边的百分比列宽会把时间挤没，
   这里改成固定像素重新分配。 */
.tx.mini{ gap:8px; }
.tx.mini .t{ width:82px; }
.tx.mini .a{ width:84px; }
.tx.mini .p{ width:74px; color:var(--text-2); font-weight:400; }

@media (max-width:640px){
  .sheet-card{ top:auto; left:0; width:100%; height:min(88%,100%);
    border-radius:var(--radius-xl) var(--radius-xl) 0 0; overflow:hidden;
    transform:translateY(100%); }
  #sheet.in .sheet-card{ transform:none; }
}

/* ============================ 经济 ============================ */
/* 来源占比：用一条横向条形表达各来源的笔数占比，比纯数字直观 */
.src{ display:flex; align-items:center; gap:12px; padding:11px 0;
  box-shadow: inset 0 -1px 0 var(--hairline); }
.src:last-child{ box-shadow:none; }
.src .nm{ flex:none; width:min(150px,30%); font-size:13.5px; font-weight:560;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.src .bar{ flex:1; height:8px; border-radius:100px; background:var(--field);
  overflow:hidden; display:flex; }
.src .bar i{ display:block; height:100%; }
.src .bar .i{ background:var(--accent-2); }
.src .bar .o{ background:var(--danger); }
.src .amt{ flex:none; font-size:11.5px; color:var(--text-2); text-align:right;
  width:min(190px,38%); font-variant-numeric:tabular-nums; }

.tx{ display:flex; align-items:center; gap:10px; padding:9px 0; font-size:12.5px;
  box-shadow: inset 0 -1px 0 var(--hairline); }
.tx:last-child{ box-shadow:none; }
.tx .t{ flex:none; width:min(140px,26%); color:var(--text-3); font-family:var(--font-mono);
  font-size:11px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.tx .p{ flex:none; width:min(120px,20%); font-weight:560;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.tx .a{ flex:none; width:min(110px,18%); font-variant-numeric:tabular-nums; font-weight:590; }
.tx .a.up{ color:var(--accent-2); }
.tx .a.down{ color:var(--danger); }
.tx .s{ flex:1; color:var(--text-2); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

/* ============================ 杂项 ============================ */
.toast{
  position:fixed; left:50%; bottom:34px; translate:-50% 0; z-index:50;
  padding:11px 22px; border-radius:100px; font-size:14.5px; font-weight:510;
  background:rgba(28,28,30,.90); color:#fff;
  backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);
  box-shadow:0 8px 30px rgba(0,0,0,.22);
  opacity:0; transform:translateY(18px) scale(.94); pointer-events:none;
  transition:opacity .35s var(--spring), transform .35s var(--spring);
}
.toast.on{ opacity:1; transform:none; }
.toast.bad{ color:#FF6961; }

.empty{ text-align:center; padding:42px 20px; color:var(--text-3); font-size:15px; }
.note{ font-size:12.5px; color:var(--text-2); line-height:1.65; }
.note code{ font-family:var(--font-mono); font-size:11.5px; background:var(--field);
  padding:1.5px 6px; border-radius:6px; }

/* ---- 自定义对话框：取代 alert / confirm / prompt ----
   浏览器原生弹窗长得和系统一样，样式完全不可控，
   这里按 iOS 警告框的形态自己实现一套。 */
#dlg{ position:fixed; inset:0; z-index:90; display:none; place-items:center; padding:24px;
  background:rgba(0,0,0,.22); backdrop-filter:blur(3px); -webkit-backdrop-filter:blur(3px); }
#dlg.on{ display:grid; }
.dlg-card{ width:min(300px,100%); border-radius:14px; padding:22px 20px 0; text-align:center;
  overflow:hidden; animation:pop .38s var(--spring) both;
  background:rgba(255,255,255,.94);
  backdrop-filter:saturate(180%) blur(20px); -webkit-backdrop-filter:saturate(180%) blur(20px);
  box-shadow:0 12px 48px rgba(0,0,0,.22); }
@keyframes pop{ from{ opacity:0; transform:scale(.86);} }
.dlg-card h4{ font-size:17px; font-weight:640; letter-spacing:-.02em; }
.dlg-card p{ font-size:13px; color:var(--text-2); margin-top:7px; line-height:1.55; }
.dlg-card input{ margin-top:16px; text-align:center; }
.dlg-acts{ display:flex; margin:20px -22px 0; box-shadow: inset 0 1px 0 var(--hairline); }
.dlg-acts button{ flex:1; border:0; background:transparent; padding:14px 8px; cursor:pointer;
  font:inherit; font-size:16px; color:var(--accent); transition:background .2s; }
.dlg-acts button:hover{ background:rgba(60,60,67,.06); }
.dlg-acts button+button{ box-shadow: inset 1px 0 0 var(--hairline); font-weight:620; }
.dlg-acts button.danger{ color:var(--danger); }

#veil{ position:fixed; inset:0; z-index:80; display:none; place-items:center;
  background:rgba(242,242,247,.78); backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px); }
#veil.on{ display:grid; }
#veil div{ text-align:center; font-size:15px; font-weight:530; }
.spin{ width:34px; height:34px; margin:0 auto 16px; border-radius:50%;
  border:3px solid var(--hairline); border-top-color:var(--accent);
  animation:spin .9s linear infinite; }
@keyframes spin{ to{ transform:rotate(360deg);} }

/* 滚动条 */
::-webkit-scrollbar{ width:10px; height:10px; }
::-webkit-scrollbar-thumb{ background:var(--track); border-radius:10px;
  border:3px solid transparent; background-clip:content-box; }
</style>
</head>
<body>

<div class="aurora"><i></i><i></i><i></i><i></i></div>

<!-- ============================ 登录 ============================ -->
<section id="login">
  <!-- novalidate：关掉浏览器自带的「请填写此字段」气泡，改用页面内提示 -->

      <span id="oauthLabel">使用 OAuth 登录</span>

<!-- ============================ 主体 ============================ -->
<div id="app">
  <aside class="frosted">
    <div class="brand">
      <img class="mark" src="/logo.png" alt="" width="30" height="30">

    <nav role="tablist">

      <button class="tab" role="tab" data-view="config" aria-selected="false">
        <span class="sq"><svg viewBox="0 0 24 24"><path d="M3 7h9M17 7h4M3 17h4M12 17h9"/><circle cx="14.5" cy="7" r="2.6"/><circle cx="9.5" cy="17" r="2.6"/></svg></span>配置</button>
      <button class="tab" role="tab" data-view="players" aria-selected="false">
        <span class="sq"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.6"/><path d="M4.8 20a7.2 7.2 0 0 1 14.4 0"/></svg></span>玩家</button>
      <button class="tab" role="tab" data-view="economy" aria-selected="false">

    <div style="margin-top:auto; padding-top:16px">

  <main>
    <!-- 概览 -->

      </div>
      <input id="cfgFilter" placeholder="搜索配置项…" style="max-width:320px">

      <div class="savebar glass" id="saveBar">

               autocomplete="off" spellcheck="false">

      </div>
      <p class="sub" id="pHint">列表显示在线玩家。要查离线玩家的余额、封禁状态或流水，在上面搜名字。</p>

<!-- 玩家详情抽屉 -->
<div id="sheet" role="dialog" aria-modal="true" aria-labelledby="shName">
  <div class="scrim" id="sheetScrim"></div>
  <div class="sheet-card">
    <div class="sheet-top">
      <div class="id">
        <b id="shName">—</b>
        <div class="meta" id="shChips"></div>
      </div>
      <button class="sheet-x" id="sheetClose" type="button" aria-label="关闭">✕</button>
    </div>
    <div class="sheet-body" id="shBody"></div>
  </div>
</div>

<div class="toast glass" id="toast"></div>
<div id="veil"><div><div class="spin"></div><span id="veilText">处理中…</span></div></div>

<div id="dlg" role="dialog" aria-modal="true">
  <div class="dlg-card glass">
    <h4 id="dlgTitle"></h4>
    <p id="dlgMsg"></p>
    <input id="dlgInput" style="display:none">
    <div class="dlg-acts">
      <button type="button" id="dlgNo">取消</button>
      <button type="button" id="dlgYes">确定</button>
    </div>
  </div>
</div>

<script>
"use strict";
/* ------------------------------------------------------------------
   说明：所有来自服务端的字符串一律用 textContent / value 写入，
   全程不用 innerHTML 拼接数据，避免玩家名或配置值里的内容被当成 HTML。
   ------------------------------------------------------------------ */

const $  = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];

const store = {
  get token(){ return sessionStorage.getItem("ee_panel_token"); },
  set token(v){ v ? sessionStorage.setItem("ee_panel_token", v) : sessionStorage.removeItem("ee_panel_token"); }
};

let dirty = {};      // 待保存的配置改动 path -> value
let cfgCache = null; // 最近一次拉到的配置树

/* ---------------------------- 网络 ---------------------------- */
async function api(path, method = "GET", body){
  const res = await fetch("/api" + path, {
    method,
    headers: Object.assign(
      { "Accept": "application/json" },
      body ? { "Content-Type": "application/json" } : {},
      store.token ? { "Authorization": "Bearer " + store.token } : {}
    ),
    body: body ? JSON.stringify(body) : undefined
  });
  let data = null;
  try { data = await res.json(); } catch(_){ /* 非 JSON 响应 */ }
  if (res.status === 401){ store.token = null; showLogin("会话已过期，请重新登录"); throw new Error("unauthorized"); }
  if (!res.ok || (data && data.success === false)) throw new Error((data && data.message) || ("HTTP " + res.status));
  return data ? data.data : null;
}

/* ---------------------------- 提示 ---------------------------- */
let toastTimer;
function toast(msg, bad){
  const el = $("#toast");
  el.textContent = msg;
  el.classList.toggle("bad", !!bad);
  el.classList.add("on");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("on"), 2600);
}
const veil = (on, text) => { $("#veilText").textContent = text || "处理中…"; $("#veil").classList.toggle("on", !!on); };

/* ---------------------------- 对话框 ----------------------------
   取代浏览器原生的 confirm / prompt。
   ask({title, message})                 → Promise<boolean>
   ask({title, input:true, value, ...})  → Promise<string|null>（取消为 null）
   ------------------------------------------------------------- */
let dlgResolve = null;
function ask(opts){
  const o = opts || {};
  const box = $("#dlg"), input = $("#dlgInput"), yes = $("#dlgYes"), no = $("#dlgNo");

  $("#dlgTitle").textContent = o.title || "";
  $("#dlgMsg").textContent = o.message || "";
  $("#dlgMsg").style.display = o.message ? "" : "none";

  input.style.display = o.input ? "" : "none";
  input.value = o.value == null ? "" : String(o.value);
  input.placeholder = o.placeholder || "";
  input.type = o.numeric ? "number" : "text";

  yes.textContent = o.confirmText || "确定";
  no.textContent = o.cancelText || "取消";
  yes.classList.toggle("danger", !!o.danger);

  box.classList.add("on");
  setTimeout(() => (o.input ? input : yes).focus(), 60);

  return new Promise(resolve => {
    dlgResolve = value => {
      box.classList.remove("on");
      dlgResolve = null;
      resolve(value);
    };
  });
}
$("#dlgYes").addEventListener("click", () => {
  if (!dlgResolve) return;
  const input = $("#dlgInput");
  dlgResolve(input.style.display === "none" ? true : input.value);
});
$("#dlgNo").addEventListener("click", () => {
  if (!dlgResolve) return;
  dlgResolve($("#dlgInput").style.display === "none" ? false : null);
});
$("#dlgInput").addEventListener("keydown", e => { if (e.key === "Enter") $("#dlgYes").click(); });
document.addEventListener("keydown", e => {
  if (!dlgResolve) return;
  if (e.key === "Escape") $("#dlgNo").click();
});

/* ---------------------------- 登录 ---------------------------- */
function showLogin(msg){
  $("#app").classList.remove("on");
  $("#login").style.display = "grid";
  $("#loginMsg").textContent = msg || "";
  $("#pw").value = "";
}
function showApp(){
  $("#login").style.display = "none";
  $("#app").classList.add("on");
  loadOverview();
}

$("#loginForm").addEventListener("submit", async e => {
  e.preventDefault();
  if ($("#pwBox").hidden) return;   // 只启用了 OAuth 时，回车不该走密码登录
  const pw = $("#pw");
  if (!pw.value){
    pw.classList.add("bad");
    $("#loginMsg").textContent = "请输入面板密码";
    pw.focus();
    return;
  }
  pw.classList.remove("bad");
  $("#loginMsg").textContent = "";
  const btn = $("#loginBtn");
  btn.disabled = true;
  try{
    const data = await api("/login", "POST", { password: $("#pw").value });
    store.token = data.token;
    showApp();
  }catch(err){
    $("#loginMsg").textContent = err.message;
  }finally{
    btn.disabled = false;
  }
});

$("#logoutBtn").addEventListener("click", async () => {
  try{ await api("/logout", "POST"); }catch(_){}
  store.token = null;
  showLogin("已退出登录");
});

/* ---------------------------- 导航 ---------------------------- */
$$(".tab").forEach(tab => tab.addEventListener("click", () => {
  $$(".tab").forEach(t => t.setAttribute("aria-selected", String(t === tab)));
  const view = tab.dataset.view;
  $$(".view").forEach(v => v.classList.toggle("on", v.id === "v-" + view));
  if (view === "overview") loadOverview();
  if (view === "config" && !cfgCache) loadConfig();
  if (view === "players") loadPlayers();
  if (view === "economy") loadEconomy();
}));

/* ---------------------------- 概览 ---------------------------- */
function tile(k, v, s){
  const el = document.createElement("div");
  el.className = "tile glass";
  const kd = document.createElement("div"); kd.className = "k"; kd.textContent = k;
  const vd = document.createElement("div"); vd.className = "v"; vd.textContent = v;
  el.append(kd, vd);
  if (s){ const sd = document.createElement("div"); sd.className = "s"; sd.textContent = s; el.append(sd); }
  return el;
}

async function loadOverview(){
  let d;
  try{ d = await api("/overview"); }catch(_){ return; }

  $("#verTag").textContent = "v" + d.pluginVersion;
  $("#srvLine").textContent =
    d.serverVersion + (d.folia ? " · Folia" : "") + " · 存储 " + d.storage + (d.vaultHooked ? " · Vault 已接管" : "");

  const tiles = $("#tiles");
  tiles.textContent = "";
  tiles.append(
    tile("在线玩家", d.onlinePlayers + " / " + d.maxPlayers),
    tile("TPS", d.tps < 0 ? "—" : d.tps.toFixed(2), d.tps < 0 ? "Folia 不提供" : ""),
    tile("内存", d.memory.usedMB + " MB", "上限 " + d.memory.maxMB + " MB"),
    tile("运行时长", d.uptime),
    tile("活动会话", String(d.sessions), "面板登录数")
  );

  const mods = $("#mods");
  mods.textContent = "";
  d.modules.forEach(m => {
    const row = document.createElement("div"); row.className = "mod";
    const left = document.createElement("div");
    const b = document.createElement("b"); b.textContent = m.name;
    const s = document.createElement("small"); s.textContent = m.id;
    left.append(b, s);
    const chip = document.createElement("span");
    chip.className = "chip " + (m.enabled ? "good" : (m.available ? "" : "warn"));
    chip.textContent = m.enabled ? "已启用" : (m.available ? "已关闭" : "不可用");
    row.append(left, chip);
    mods.append(row);
  });
}

$("#pw").addEventListener("input", () => $("#pw").classList.remove("bad"));

$("#reloadBtn").addEventListener("click", async () => {
  const go = await ask({
    title: "重载插件",
    message: "会重启全部模块。面板本身也会短暂中断，之后需要重新登录。",
    confirmText: "重载", danger: true
  });
  if (!go) return;
  try{ await api("/reload", "POST"); }catch(err){ toast(err.message, true); return; }
  veil(true, "正在重载…");
  // 面板服务会被停掉再拉起，这里轮询 ping 等它回来
  let tries = 0;
  const timer = setInterval(async () => {
    tries++;
    try{
      const res = await fetch("/api/ping");
      if (res.ok){ clearInterval(timer); veil(false); store.token = null; showLogin("重载完成，请重新登录"); }
    }catch(_){ /* 还没起来 */ }
    if (tries > 40){ clearInterval(timer); veil(false); toast("重载超时，请查看控制台", true); }
  }, 1000);
});

/* ---------------------------- 配置 ---------------------------- */
function markDirty(){
  const n = Object.keys(dirty).length;
  $("#dirtyCount").textContent = n + " 项改动";
  $("#saveBar").classList.toggle("on", n > 0);
}

function control(entry){
  const wrap = document.createElement("div");
  wrap.className = "ctl";

  if (entry.type === "boolean"){
    const sw = document.createElement("button");
    sw.type = "button"; sw.className = "sw";
    sw.dataset.on = String(entry.value === true);
    sw.setAttribute("role", "switch");
    sw.setAttribute("aria-checked", sw.dataset.on);
    sw.addEventListener("click", () => {
      const next = sw.dataset.on !== "true";
      sw.dataset.on = String(next);
      sw.setAttribute("aria-checked", String(next));
      if (next === entry.value) delete dirty[entry.path]; else dirty[entry.path] = next;
      markDirty();
    });
    wrap.style.width = "auto";
    wrap.append(sw);
    return wrap;
  }

  let input;
  if (entry.type === "list"){
    input = document.createElement("textarea");
    input.value = Array.isArray(entry.value) ? entry.value.join("\n") : "";
    input.placeholder = "每行一项，留空表示不限制";
  }else{
    input = document.createElement("input");
    if (entry.sensitive){
      input.type = "password";
      input.placeholder = entry.hasValue ? "已设置，留空则不修改" : "尚未设置";
      input.autocomplete = "new-password";
    }else if (entry.type === "integer" || entry.type === "number"){
      input.type = "number";
      if (entry.type === "number") input.step = "any";
      input.value = entry.value;
    }else{
      input.type = "text";
      input.value = entry.value == null ? "" : String(entry.value);
    }
  }

  const original = entry.type === "list"
    ? (Array.isArray(entry.value) ? entry.value.join("\n") : "")
    : (entry.value == null ? "" : String(entry.value));

  input.addEventListener("input", () => {
    const v = input.value;
    // 敏感字段留空 = 保持原值，不算改动
    if (v === original || (entry.sensitive && v === "")) delete dirty[entry.path];
    else dirty[entry.path] = entry.type === "list" ? v.split("\n").filter(x => x.trim()) : v;
    markDirty();
  });

  wrap.append(input);
  return wrap;
}

function renderConfig(filter){
  const host = $("#cfgGroups");
  host.textContent = "";
  const needle = (filter || "").trim().toLowerCase();
  let shown = 0;

  cfgCache.groups.forEach(group => {
    const entries = group.entries.filter(e =>
      !needle || e.path.toLowerCase().includes(needle) || (e.comment || "").toLowerCase().includes(needle));
    if (!entries.length) return;
    shown += entries.length;

    const card = document.createElement("section");
    card.className = "grp glass";
    const header = document.createElement("header");
    const title = document.createElement("b"); title.textContent = group.label;
    header.append(title);
    if (group.comment){
      const p = document.createElement("p"); p.textContent = group.comment; header.append(p);
    }
    card.append(header);

    entries.forEach(entry => {
      const row = document.createElement("div");
      row.className = "row" + (entry.type === "list" ? " stack" : "");
      const label = document.createElement("div"); label.className = "lbl";
      const name = document.createElement("b"); name.textContent = entry.key;
      label.append(name);
      if (entry.comment){
        const desc = document.createElement("p"); desc.textContent = entry.comment; label.append(desc);
      }
      row.append(label, control(entry));
      card.append(row);
    });
    host.append(card);
  });

  if (!shown){
    const empty = document.createElement("div");
    empty.className = "empty"; empty.textContent = "没有匹配的配置项";
    host.append(empty);
  }
}

async function loadConfig(){
  try{
    cfgCache = await api("/config");
    dirty = {}; markDirty();
    renderConfig($("#cfgFilter").value);
  }catch(err){ toast(err.message, true); }
}

$("#cfgFilter").addEventListener("input", e => { if (cfgCache) renderConfig(e.target.value); });
$("#discardBtn").addEventListener("click", () => { dirty = {}; markDirty(); renderConfig($("#cfgFilter").value); });

$("#saveBtn").addEventListener("click", async () => {
  if (!Object.keys(dirty).length) return;
  const btn = $("#saveBtn"); btn.disabled = true;
  try{
    const res = await api("/config", "POST", { updates: dirty });
    if (res.rejected && res.rejected.length) toast("有 " + res.rejected.length + " 项被拒绝", true);
    else toast("已保存 " + res.changed + " 项，重载后生效");
    await loadConfig();
  }catch(err){ toast(err.message, true); }
  finally{ btn.disabled = false; }
});

/* ---------------------------- 玩家 ---------------------------- */
function chip(text, kind){
  const el = document.createElement("span");
  el.className = "chip" + (kind ? " " + kind : "");
  el.textContent = text;
  return el;
}

async function act(name, action, extra){
  try{
    await api("/players/" + encodeURIComponent(name) + "/action", "POST",
      Object.assign({ action }, extra || {}));
    toast("操作已执行");
    // 操作可能改变封禁 / 余额，列表和已打开的详情都要跟着更新
    refreshPlayerViews();
  }catch(err){ toast(err.message, true); }
}

function refreshPlayerViews(){
  if (pQuery) runSearch(pQuery); else loadPlayers();
  if (sheetName) openSheet(sheetName, true);
}

/* 一个玩家能执行的管理动作。列表卡片和详情抽屉共用，
   免得两处各写一遍、改了一处忘了另一处。 */
function playerActions(p, host){
  const add = (text, kind, handler) => {
    const b = document.createElement("button");
    b.className = "btn sm" + (kind ? " " + kind : "");
    b.textContent = text;
    b.addEventListener("click", ev => { ev.stopPropagation(); handler(); });
    host.append(b);
  };

  if (p.online !== false){
    add("踢出", "danger", async () => {
      const reason = await ask({ title: "踢出 " + p.name, input: true,
        placeholder: "理由（可留空）", confirmText: "踢出", danger: true });
      if (reason !== null) act(p.name, "kick", { reason });
    });
  }
  if (p.banned){
    add("解封", "", () => act(p.name, "unban"));
  }else{
    add("封禁", "danger", async () => {
      const reason = await ask({ title: "封禁 " + p.name,
        message: "玩家会被立即踢下线，且无法再进入服务器。", input: true,
        placeholder: "理由（可留空）", confirmText: "封禁", danger: true });
      if (reason !== null) act(p.name, "ban", { reason });
    });
    add("临时封禁", "danger", async () => {
      const duration = await ask({ title: "临时封禁 " + p.name,
        message: "时长必须带单位，例如 30m、2h、7d。", input: true,
        placeholder: "7d", confirmText: "下一步", danger: true });
      if (duration === null || !String(duration).trim()) return;
      const reason = await ask({ title: "封禁理由", input: true,
        placeholder: "理由（可留空）", confirmText: "封禁", danger: true });
      if (reason !== null) act(p.name, "tempban", { duration: String(duration).trim(), reason });
    });
  }
  add(p.muted ? "解除禁言" : "禁言", "", async () => {
    if (p.muted){ act(p.name, "unmute"); return; }
    const reason = await ask({ title: "禁言 " + p.name, input: true,
      placeholder: "理由（可留空）", confirmText: "禁言" });
    if (reason !== null) act(p.name, "mute", { reason });
  });
  add("改余额", "", async () => {
    const amount = await ask({ title: "设置 " + p.name + " 的余额", input: true, numeric: true,
      value: p.balance != null ? p.balance : 0, confirmText: "保存" });
    if (amount !== null && String(amount).trim()) act(p.name, "setbalance", { amount: String(amount).trim() });
  });
}

function playerCard(p, offline){
  const card = document.createElement("div");
  card.className = "pcard glass tap";
  card.tabIndex = 0;
  card.setAttribute("role", "button");

  const who = document.createElement("div"); who.className = "who";
  const nameEl = document.createElement("b"); nameEl.textContent = p.name;
  who.append(nameEl);

  const meta = document.createElement("div"); meta.className = "meta";
  if (offline){
    meta.append(chip("离线"));
  }else{
    meta.append(chip(p.world), chip(p.ping + "ms"), chip(p.gamemode.toLowerCase()));
  }
  if (p.balance != null) meta.append(chip("余额 " + Number(p.balance).toFixed(2)));
  if (p.playtime) meta.append(chip(p.playtime));
  if (p.afk) meta.append(chip("挂机", "warn"));
  if (p.vanished) meta.append(chip("隐身", "warn"));
  if (p.muted) meta.append(chip("禁言", "bad"));
  if (p.banned) meta.append(chip("已封禁", "bad"));
  if (p.op) meta.append(chip("OP", "good"));
  who.append(meta);
  card.append(who);

  // 搜索结果只有名字和余额，动作按钮要拿到完整状态才准，交给详情里做
  if (!offline){
    const acts = document.createElement("div"); acts.className = "acts";
    playerActions(Object.assign({ online: true }, p), acts);
    card.append(acts);
  }

  const open = () => openSheet(p.name);
  card.addEventListener("click", open);
  card.addEventListener("keydown", ev => {
    if (ev.key === "Enter" || ev.key === " "){ ev.preventDefault(); open(); }
  });
  return card;
}

async function loadPlayers(){
  let list;
  try{ list = await api("/players"); }catch(_){ return; }

  $("#pCount").textContent = list.length ? ("当前 " + list.length + " 人在线") : "";
  const host = $("#plist");
  host.textContent = "";

  if (!list.length){
    const empty = document.createElement("div");
    empty.className = "empty glass"; empty.textContent = "当前没有玩家在线";
    host.append(empty);
    return;
  }
  list.forEach(p => host.append(playerCard(p, false)));
}
$("#refreshPlayers").addEventListener("click", refreshPlayerViews);

/* ------------------------- 搜索（含离线） ------------------------- */
let pQuery = "";
let searchTimer = null;
let searchSeq = 0;

async function runSearch(query){
  // 每次请求带序号，慢的那个回来时如果已经不是最新一次搜索就直接丢掉，
  // 否则快速打字时旧结果会盖掉新结果
  const seq = ++searchSeq;
  let list;
  try{ list = await api("/players/search?q=" + encodeURIComponent(query)); }
  catch(err){ toast(err.message, true); return; }
  if (seq !== searchSeq || pQuery !== query) return;

  const host = $("#plist");
  host.textContent = "";
  $("#pCount").textContent = "搜索 “" + query + "”：" + list.length + " 个结果";
  if (!list.length){
    const empty = document.createElement("div");
    empty.className = "empty glass";
    empty.textContent = "没有匹配的玩家";
    host.append(empty);
    return;
  }
  list.forEach(p => host.append(playerCard(p, true)));
}

function onSearchInput(){
  const value = $("#pSearch").value.trim();
  $("#pSearchBox").classList.toggle("has", value.length > 0);
  pQuery = value;
  clearTimeout(searchTimer);
  if (!value){ loadPlayers(); return; }
  // 等打字停下来再查，别每敲一个字母就去翻一次数据库
  searchTimer = setTimeout(() => runSearch(value), 220);
}
$("#pSearch").addEventListener("input", onSearchInput);
$("#pSearchClear").addEventListener("click", () => {
  $("#pSearch").value = "";
  onSearchInput();
  $("#pSearch").focus();
});

/* --------------------------- 详情抽屉 --------------------------- */
let sheetName = null;

/* rows 的每一项是 [标签, 值, 选项]，选项 "bad" 标红、"col" 上下排列 */
function kvRow(host, key, value, kind){
  const row = document.createElement("div");
  row.className = "r" + (kind === "col" ? " col" : "");
  const k = document.createElement("span"); k.className = "k"; k.textContent = key;
  const v = document.createElement("span");
  v.className = "v" + (kind === "bad" ? " bad" : ""); v.textContent = value;
  row.append(k, v);
  host.append(row);
  return row;
}

function kvBlock(title, rows){
  const wrap = document.createElement("div");
  if (title){
    const h = document.createElement("h4"); h.textContent = title;
    wrap.append(h);
  }
  const box = document.createElement("div"); box.className = "kv";
  rows.forEach(r => kvRow(box, r[0], r[1], r[2]));
  wrap.append(box);
  return wrap;
}

function closeSheet(){
  const box = $("#sheet");
  box.classList.remove("in");
  sheetName = null;
  // 等滑出动画放完再真正隐藏，否则下次打开会闪一下
  setTimeout(() => { if (!sheetName) box.classList.remove("on"); }, 380);
}

/** @param quiet 内容刷新，不重新播放打开动画 */
async function openSheet(name, quiet){
  sheetName = name;
  const box = $("#sheet");
  if (!quiet){
    box.classList.add("on");
    requestAnimationFrame(() => box.classList.add("in"));
    $("#shName").textContent = name;
    $("#shChips").textContent = "";
    $("#shBody").textContent = "";
  }

  let d;
  try{ d = await api("/players/" + encodeURIComponent(name) + "/detail"); }
  catch(err){ toast(err.message, true); closeSheet(); return; }
  if (sheetName !== name) return;

  $("#shName").textContent = d.nickname ? (d.name + "（" + d.nickname + "）") : d.name;
  const chips = $("#shChips");
  chips.textContent = "";
  chips.append(chip(d.online ? "在线" : "离线", d.online ? "good" : ""));
  if (d.banned) chips.append(chip("已封禁", "bad"));
  if (d.muted) chips.append(chip("禁言中", "bad"));
  if (d.live && d.live.op) chips.append(chip("OP", "good"));

  const body = $("#shBody");
  body.textContent = "";

  const acts = document.createElement("div"); acts.className = "sheet-acts";
  playerActions(d, acts);
  body.append(acts);

  const basics = [
    ["余额", Number(d.balance || 0).toFixed(2)],
    ["游戏时长", d.playtime || "-"],
    ["首次加入", d.firstJoinText],
    ["最后在线", d.online ? "当前在线" : d.lastSeenText],
    ["家的数量", String(d.homes != null ? d.homes : 0)],
    ["UUID", d.uuid, "col"]
  ];
  body.append(kvBlock("档案", basics));

  if (d.online && d.live){
    body.append(kvBlock("当前状态", [
      ["世界", d.live.world],
      ["延迟", d.live.ping + " ms"],
      ["模式", String(d.live.gamemode || "").toLowerCase()],
      ["生命", String(d.live.health)]
    ]));
  }

  if (d.banned){
    body.append(kvBlock("封禁", [
      ["理由", d.banReason || "-"],
      ["操作者", d.banSource || "-"],
      ["到期", d.banExpiryText, "bad"]
    ]));
  }
  if (d.muted){
    body.append(kvBlock("禁言", [
      ["理由", d.muteReason || "-"],
      ["操作者", d.muteSource || "-"],
      ["到期", d.muteExpiryText, "bad"]
    ]));
  }

  const ledgerWrap = document.createElement("div");
  const ledgerTitle = document.createElement("h4");
  ledgerTitle.textContent = "经济流水";
  const ledgerBox = document.createElement("div");
  ledgerBox.className = "panel glass";
  const loading = document.createElement("p");
  loading.className = "note"; loading.textContent = "读取中…";
  ledgerBox.append(loading);
  ledgerWrap.append(ledgerTitle, ledgerBox);
  body.append(ledgerWrap);

  let ledger;
  try{ ledger = await api("/players/" + encodeURIComponent(name) + "/ledger?limit=40"); }
  catch(err){ loading.textContent = "读取流水失败：" + err.message; return; }
  if (sheetName !== name) return;

  ledgerBox.textContent = "";
  if (!ledger.length){
    const none = document.createElement("p");
    none.className = "note";
    none.textContent = "没有流水记录。可能是这名玩家还没有过交易，或 modules.economy 的流水记录未开启。";
    ledgerBox.append(none);
    return;
  }
  ledger.forEach(t => {
    const row = document.createElement("div"); row.className = "tx mini";
    const time = document.createElement("span"); time.className = "t";
    // 抽屉里放不下完整时间戳，砍掉年份和秒；完整时间在 title 上
    time.textContent = String(t.time || "").slice(5, 16);
    time.title = t.time || "";
    const amount = document.createElement("span");
    const up = t.type === "DEPOSIT";
    amount.className = "a " + (t.type === "SET" ? "" : (up ? "up" : "down"));
    amount.textContent = (t.type === "SET" ? "±" : (up ? "+" : "−")) + Number(t.amount).toFixed(2);
    const after = document.createElement("span"); after.className = "p";
    after.textContent = Number(t.balanceAfter).toFixed(2);
    const src = document.createElement("span"); src.className = "s";
    src.textContent = [t.source, t.detail].filter(Boolean).join(" · ") || "-";
    src.title = src.textContent;   // 列宽有限，靠 hover 看全
    row.append(time, amount, after, src);
    ledgerBox.append(row);
  });
}

$("#sheetClose").addEventListener("click", closeSheet);
$("#sheetScrim").addEventListener("click", closeSheet);
document.addEventListener("keydown", ev => {
  // 对话框也监听 Esc，它层级更高，开着的时候把这次按键让给它
  if (ev.key === "Escape" && sheetName && !$("#dlg").classList.contains("on")) closeSheet();
});

/* ---------------------------- 经济 ---------------------------- */
function money(symbol, value){
  return symbol + Number(value || 0).toLocaleString("en-US",
    { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

async function loadEconomy(){
  let d;
  try{ d = await api("/economy"); }catch(err){ toast(err.message, true); return; }

  $("#ecoLine").textContent = d.tracking
    ? ("统计窗口：近 " + d.windowDays + " 天")
    : "流水记录已关闭，仅显示余额统计";

  const tiles = $("#ecoTiles");
  tiles.textContent = "";
  tiles.append(
    tile("流通总量", money(d.symbol, d.total)),
    tile("账户数", String(d.accounts)),
    tile("人均余额", money(d.symbol, d.average)),
    tile("最高余额", money(d.symbol, d.richest))
  );
  if (d.tracking){
    tiles.append(tile("净流入", money(d.symbol, d.inflow - d.outflow),
      "+" + money(d.symbol, d.inflow) + " / -" + money(d.symbol, d.outflow)));
  }

  // ---- 来源 ----
  $("#srcTitle").textContent = "资金来源 · 近 " + d.windowDays + " 天";
  const srcHost = $("#srcList");
  srcHost.textContent = "";
  if (!d.tracking || !d.sources.length){
    const empty = document.createElement("div");
    empty.className = "empty";
    empty.textContent = d.tracking ? "这段时间还没有流水记录" : "开启 track-transactions 后即可看到资金流向";
    srcHost.append(empty);
  }else{
    const peak = Math.max(...d.sources.map(s => s.in + s.out), 1);
    d.sources.forEach(s => {
      const row = document.createElement("div"); row.className = "src";
      const nm = document.createElement("div"); nm.className = "nm"; nm.textContent = s.source;
      const bar = document.createElement("div"); bar.className = "bar";
      const inBar = document.createElement("i"); inBar.className = "i";
      inBar.style.width = (s.in / peak * 100) + "%";
      const outBar = document.createElement("i"); outBar.className = "o";
      outBar.style.width = (s.out / peak * 100) + "%";
      bar.append(inBar, outBar);
      const amt = document.createElement("div"); amt.className = "amt";
      amt.textContent = s.count + " 笔 · +" + money(d.symbol, s.in) + " / -" + money(d.symbol, s.out);
      row.append(nm, bar, amt);
      srcHost.append(row);
    });
  }

  // ---- 最近流水 ----
  const txHost = $("#txList");
  txHost.textContent = "";
  if (!d.recent.length){
    const empty = document.createElement("div");
    empty.className = "empty"; empty.textContent = "暂无流水";
    txHost.append(empty);
    return;
  }
  d.recent.forEach(t => {
    const row = document.createElement("div"); row.className = "tx";
    const time = document.createElement("div"); time.className = "t"; time.textContent = t.time;
    const who = document.createElement("div"); who.className = "p"; who.textContent = t.player || "-";
    const amt = document.createElement("div");
    const up = t.type === "DEPOSIT";
    amt.className = "a " + (t.type === "SET" ? "" : (up ? "up" : "down"));
    amt.textContent = (t.type === "SET" ? "±" : (up ? "+" : "-")) + money(d.symbol, t.amount);
    const src = document.createElement("div"); src.className = "s";
    src.textContent = t.detail ? (t.source + " · " + t.detail) : t.source;
    row.append(time, who, amt, src);
    txHost.append(row);
  });
}
$("#refreshEco").addEventListener("click", loadEconomy);

/* ---------------------------- OAuth ---------------------------- */
$("#oauthBtn").addEventListener("click", async () => {
  const btn = $("#oauthBtn");
  btn.disabled = true;
  try{
    const data = await api("/oauth/start");
    location.href = data.url;
  }catch(err){
    $("#loginMsg").textContent = err.message;
    btn.disabled = false;
  }
});

/** 按服务端实际启用的方式决定登录页显示什么。 */
async function applyLoginMethods(){
  let info;
  try{
    const res = await fetch("/api/ping");
    info = (await res.json()).data;
  }catch(_){ return; }

  $("#pwBox").hidden = !info.password;
  $("#oauthBtn").hidden = !info.oauth;
  $("#sepBox").hidden = !(info.password && info.oauth);
  if (info.oauthLabel) $("#oauthLabel").textContent = info.oauthLabel;
}

/**
 * 从 URL fragment 里取回 OAuth 回调带来的会话。
 * fragment 不会发给服务端、也不进访问日志，所以拿它传 token 比 query string 安全；
 * 读完立刻用 replaceState 清掉，免得留在地址栏和浏览器历史里。
 */
function consumeCallbackFragment(){
  const hash = location.hash.slice(1);
  if (!hash) return null;
  const params = new URLSearchParams(hash);
  const token = params.get("token");
  const error = params.get("error");
  if (token || error){
    history.replaceState(null, "", location.pathname);
  }
  if (token){ store.token = token; return "ok"; }
  if (error){ return error; }
  return null;
}

/* ---------------------------- 启动 ---------------------------- */
(async function boot(){
  const callback = consumeCallbackFragment();
  await applyLoginMethods();

  if (callback && callback !== "ok"){ showLogin(callback); return; }
  if (!store.token){ showLogin(); return; }
  try{ await api("/overview"); showApp(); }
  catch(_){ /* api() 内部已经在 401 时切回登录页 */ }
})();
</script>
