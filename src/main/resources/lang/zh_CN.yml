# ============================================================
#  EssentialEngine 简体中文语言文件
#
#  · 颜色使用 MiniMessage 十六进制标签，配色约定：
#      成功 #7BC96F   失败 #E06C75   警告 #E5C07B
#      主色 #61AFEF   正文 #E8EAED   次要 #8B95A5   弱化 #5C6370
#  · 占位符写作 {name}，发送时自动替换
#  · 把某条消息的值改成空字符串 "" 即可让插件不再发送它
#  · 玩家看到哪份语言文件由其客户端语言决定（zh_* → 本文件，
#    其余 → en_US.yml）；缺失的键会自动回落到插件内置文件
# ============================================================

general:
  no-permission: "<#E06C75>你没有权限执行这个操作。 <#5C6370>({permission})"
  player-only: "<#E06C75>这个命令只能由玩家执行。"
  usage: "<#E5C07B>用法: <#E8EAED>{usage}"
  player-not-found: "<#E06C75>找不到玩家: <#E8EAED>{player}"
  invalid-number: "<#E06C75>请输入一个有效的数字。"
  internal-error: "<#E06C75>执行时发生错误，详情请查看控制台。"
  console: "控制台"
  permanent: "永久"
  none: "无"

