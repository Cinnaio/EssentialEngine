  player-only: "<red>这个命令只能由玩家执行。"
  usage: "<yellow>用法: <white>{usage}"
  player-not-found: "<red>找不到玩家: <white>{player}"
  invalid-number: "<red>请输入一个有效的数字。"
  internal-error: "<red>执行时发生错误，详情请查看控制台。"
  console: "控制台"
  permanent: "永久"
  none: "无"

