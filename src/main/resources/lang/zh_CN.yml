# ============================================================
#  EssentialEngine 简体中文语言文件
#
#  · 颜色使用 MiniMessage 命名标签，走原版 Minecraft 配色，约定：
#      正文 <white>   次要 <gray>   弱化 <dark_gray>
#      失败 <red>   警告 <yellow>   标题 <aqua>   金额 <gold>
#      成功消息：句子 <white>、其中的数值 / 名字用 <green> 强调；
#      没有数值的纯确认短句整句 <green>
#      经济类消息走黄金搭配：玩家名 <yellow>、金额 <gold>
#      <green> 和 <yellow> 不要出现在同一条消息里（黄配金、绿配白）
#  · 占位符写作 {name}，发送时自动替换
#  · 把某条消息的值改成空字符串 "" 即可让插件不再发送它
#  · 玩家看到哪份语言文件由其客户端语言决定（zh_* → 本文件，
#    其余 → en_US.yml）；缺失的键会自动回落到插件内置文件
# ============================================================

general:
