# ============================================================
#  EssentialEngine - English language file
#
#  · Colours use MiniMessage named tags with the vanilla Minecraft palette:
#      body <white>   secondary <gray>   muted <dark_gray>
#      error <red>   warning <yellow>   heading <aqua>   money <gold>
#      success messages: <white> sentence with <green> highlights on the
#      values; short confirmations with no value stay fully <green>
#      economy messages pair yellow with gold: names <yellow>, money <gold>
#      never mix <green> and <yellow> in one message (yellow+gold, green+white)
#  · Placeholders look like {name} and are replaced on send
#  · Set a message to "" to silence it entirely
#  · Which file a player sees follows their client language
#    (zh_* -> zh_CN.yml, everything else -> this file);
#    missing keys fall back to the bundled defaults
# ============================================================

general:
  no-permission: "<red>You don't have permission to do that. <dark_gray>({permission})"
  player-only: "<red>This command can only be used by a player."
  usage: "<yellow>Usage: <white>{usage}"
  player-not-found: "<red>Player not found: <white>{player}"
  invalid-number: "<red>Please provide a valid number."
  internal-error: "<red>Something went wrong. Check the console for details."
  console: "Console"
  permanent: "Permanent"
  none: "None"

