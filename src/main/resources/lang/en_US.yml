# ============================================================
#  EssentialEngine - English language file
#
#  · Colours use MiniMessage hex tags. Palette convention:
#      success #7BC96F   error #E06C75   warning #E5C07B
#      accent #61AFEF    body #E8EAED    secondary #8B95A5   muted #5C6370
#  · Placeholders look like {name} and are replaced on send
#  · Set a message to "" to silence it entirely
#  · Which file a player sees follows their client language
#    (zh_* -> zh_CN.yml, everything else -> this file);
#    missing keys fall back to the bundled defaults
# ============================================================

general:
  no-permission: "<#E06C75>You don't have permission to do that. <#5C6370>({permission})"
  player-only: "<#E06C75>This command can only be used by a player."
  usage: "<#E5C07B>Usage: <#E8EAED>{usage}"
  player-not-found: "<#E06C75>Player not found: <#E8EAED>{player}"
  invalid-number: "<#E06C75>Please provide a valid number."
  internal-error: "<#E06C75>Something went wrong. Check the console for details."
  console: "Console"
  permanent: "Permanent"
  none: "None"

# Localized fragments for durations and timestamps: 3d 2h / 3h ago
time:
  day: "d"
  hour: "h"
  minute: "m"
  second: "s"
  separator: " "
  never: "Never"
  ago: "{duration} ago"

