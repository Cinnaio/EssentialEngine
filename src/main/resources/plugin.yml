name: EssentialEngine
version: '${version}'
main: com.github.cinnaio.essentialengine.EssentialEngine
api-version: '26.1'
folia-supported: true
description: 模块化服务器基础功能插件 —— 传送、玩家指令、聊天、管理、经济，并内置可选的 REST API 与 HuskTowns 对接
authors:
  - Cinnaio
website: https://github.com/Cinnaio/EssentialEngine
# softdepend 保证 Vault 在本插件之前被加载，这样 onLoad 阶段就能拿到 Vault 的类。
# 经济服务本身在 onLoad 里注册（早于所有插件的 onEnable），所以不需要 load: STARTUP，
# 也不需要维护一份 loadbefore 名单。
softdepend:
  - HuskTowns
  - Vault
  - PlaceholderAPI

# 注意：本插件的命令全部在模块启用时动态注册，因此这里不需要声明 commands。
# 关闭某个模块后，它的命令会真正从服务端命令表里消失。
permissions:
  essentialengine.admin:
    description: 使用 /ee 管理命令
    default: op
  essentialengine.command.home:
    default: true
  essentialengine.command.sethome:
    default: true
  essentialengine.command.delhome:
    default: true
  essentialengine.command.homes:
    default: true
  essentialengine.command.warp:
