# ============================================================
#  EssentialEngine 配置文件
#  模块化服务器基础功能插件（Paper / Folia 1.21.4+）
#
#  每个模块都可以单独开关；关闭后它的命令会从服务端命令表中移除，
#  不会和其它插件抢占命令名。
# ============================================================

# 控制台 / 回退语言，对应 lang/<语言>.yml（内置 zh_CN 与 en_US）。
# 玩家看到的消息自动跟随其客户端语言：中文客户端（zh_*）用 zh_CN，
# 其余语言回退到 en_US；往 lang/ 目录添加 ja_JP.yml 之类的文件即可扩展。
language: zh_CN

# 打开后会输出更多调试日志（例如自动保存了多少份数据）
debug: false

# ------------------------------------------------------------
#  存储后端
# ------------------------------------------------------------
storage:
  # yaml   —— 每个玩家一个 yml 文件，零外部依赖，适合中小型服务器（推荐）
  # sqlite —— 单文件数据库，玩家量大时更快
  # mysql  —— 多服共享同一份玩家数据（余额、家、封禁都会同步）
  type: yaml

  # 在线玩家数据的自动保存间隔（分钟）
  auto-save-minutes: 5

  # SQLite / MySQL 驱动会在第一次使用时自动下载到 plugins/EssentialEngine/libs/。
  # 国内服务器如果下载慢，可以换成镜像，例如：
  #   https://maven.aliyun.com/repository/public
  maven-repository: "https://repo1.maven.org/maven2"

  sqlite:
    file: database.db
    table-prefix: "ee_"
    driver-version: "3.47.1.0"

  mysql:
    host: 127.0.0.1
    port: 3306
    database: minecraft
    username: root
    password: ""
    parameters: "useSSL=false&characterEncoding=utf8&serverTimezone=UTC"
    table-prefix: "ee_"
    driver-version: "9.1.0"

# ------------------------------------------------------------
#  命令控制
# ------------------------------------------------------------
commands:
  # 不想让本插件接管的命令写在这里，插件就完全不会注册它
  # 例如已经装了别的传送插件：disabled: ["tp", "tphere"]
  disabled: []

  # 给命令追加自定义别名（原有别名仍然有效）
  aliases:
    home: []
    spawn: []
    balance: []

# ------------------------------------------------------------
#  功能模块
# ------------------------------------------------------------
modules:

  # 插件自身的管理命令 /ee，建议保持开启
  core:
    enabled: true

  # ---------------- 传送 ----------------
  # /home /sethome /delhome /homes /warp /setwarp /delwarp /warps
  # /spawn /setspawn /tpa /tpahere /tpaccept /tpdeny /tpacancel /back /tp /tphere /rtp
  teleport:
    enabled: true
    # 传送吟唱秒数，0 表示立即传送；权限 essentialengine.teleport.bypass.warmup 可免除
    warmup-seconds: 3
    # 传送冷却秒数；权限 essentialengine.teleport.bypass.cooldown 可免除
    cooldown-seconds: 5
    # 吟唱期间移动 / 受伤是否打断
    cancel-on-move: true
    cancel-on-damage: true
    # 默认可设置的家数量；也可以用权限 essentialengine.homes.<数字> 单独提升，
    # 或 essentialengine.homes.unlimited 解除限制
    max-homes: 3
    # 传送请求多少秒后过期
    request-expire-seconds: 60
    # 死亡地点是否记入 /back
    back-on-death: true
    # 每个地标是否需要单独权限 essentialengine.warp.<地标名>
    per-warp-permission: false
    rtp:
      enabled: true
      # 留空表示在玩家当前世界随机传送
      world: ""
      min-radius: 500
      max-radius: 5000
      # 找不到安全落点时的重试次数
      max-attempts: 8

  # ---------------- 玩家实用指令 ----------------
  # /heal /feed /fly /god /speed /gamemode(/gms /gmc /gma /gmsp) /repair /hat
  # /workbench /enderchest /top /suicide /near /ping /playtime
  player:
    enabled: true
    # /near 的默认搜索半径，以及玩家手动指定时的上限
    near-radius: 100
    near-max-radius: 1000
    # /speed 可输入的最大值。原版速度上限是固定的，这里只是换算刻度：
    # 填 10 就是 /speed 10 达到引擎最大速度，填 5 则 /speed 5 达到最大
    speed-max: 10
    # /heal 是否顺带回满饱食度、是否顺带灭火
    heal-restores-hunger: true
    heal-extinguishes-fire: true
    # /god 是否连带免疫饥饿
    god-prevents-hunger: true
    # 飞行状态是否跨登录保留（关掉则每次进服都要重新 /fly）
    fly-persist-on-join: true
    # 死亡时是否重置飞行 / 无敌，防止用它规避死亡惩罚
    reset-fly-on-death: false
    reset-god-on-death: false

  # ---------------- 聊天与消息 ----------------
  # /msg /reply /msgtoggle /socialspy /ignore /nick /broadcast /me /afk /mail
  chat:
    enabled: true
    # 是否接管聊天格式。默认关闭，避免和 LuckPerms 前缀、其它聊天插件冲突。
    # 聊天 / 私聊 / 广播等格式文本已移到 lang/<语言>.yml 的 chat.format-* 键，
    # 会按每位玩家的客户端语言分别渲染
    enable-chat-format: false
    # 多少秒无操作自动进入 AFK，0 表示关闭自动 AFK
    afk-timeout-seconds: 300
    # AFK 状态变化是否全服提示
    afk-broadcast: true
    # 昵称最大长度（不含颜色代码）
    nick-max-length: 16
    # 每位玩家的邮箱上限
    mail-max: 30

  # ---------------- 管理与惩罚 ----------------
  # /kick /ban /tempban /unban /mute /tempmute /unmute /vanish /invsee
  # /clearinventory /seen /whois
  admin:
    enabled: true
    # 惩罚是否全服广播。禁言默认不广播，避免公开处刑
    broadcast-kick: true
    broadcast-ban: true
    broadcast-mute: false
    # /tempban /tempmute 按 Tab 时提示的时长预设
    duration-presets: ["10m", "1h", "1d", "7d", "30d"]
    # 控制台执行封禁 / 禁言时，记录在玩家数据里的操作者名字
    console-name: "Console"
    # /invsee 打开只读副本（改动不会写回对方背包）
    invsee-read-only: false
    # /clearinventory 是否连盔甲一起清
    clear-includes-armor: true
    # 隐身玩家的进服 / 退服消息是否一并隐藏
    vanish-hide-join-quit: true

  # ---------------- 经济与套装 ----------------
  # /balance /pay /eco /baltop /kit
  economy:
    enabled: true
    currency-symbol: "$"
    currency-name: "金币"
    # 新玩家首次进服获得的初始资金，0 表示不发放
    starting-balance: 100.0
    # 建档后多少秒内进服才算「新玩家」并发放初始资金。
    # 太短的话，服务器卡顿或档案被别的功能提前建好，新人就永远拿不到这笔钱
    starting-balance-grace-seconds: 300
    # 单次转账的金额限制。maximum-pay 为 0 表示不限制
    minimum-pay: 0.01
    maximum-pay: 0.0
    # /pay 冷却秒数，0 表示无冷却
    pay-cooldown-seconds: 0
    # 账户余额上限，0 表示不限制（仅对 /pay 生效，管理员 /eco 不受限）
    max-balance: 0.0
    # /baltop 默认显示条数，以及玩家手动指定时的上限
    baltop-default-size: 10
    baltop-max-size: 50

    # ---- 经济流水与统计 ----
    # 因为本插件是 Vault 的经济提供者，商店 / 职业 / 任务这些插件的每一笔
    # 扣款发钱都会流经这里，所以打开后能记录到「全服所有」资金变动，
    # 而不只是本插件自己的命令。用 /eco stats 查看统计。
    track-transactions: true
    # 是否顺着调用栈识别是哪个插件发起的交易。关掉后所有外部交易都记成
    # EssentialEngine，统计里就看不出钱是被哪个商店收走的了。
    # 识别结果按类缓存，同一个插件只解析一次，开销很小。
    track-sources: true
    # 流水先攒在内存里，每隔多少秒批量落盘一次（不会在交易时同步写库）
    transaction-flush-seconds: 15
    # 内存队列上限。写满时丢弃最旧的记录，宁可少几条统计也不拖慢服务器
    transaction-queue-limit: 10000
    # 流水保留天数，超期的每小时清理一次
    transaction-retention-days: 30
    # /eco stats 的统计窗口天数，以及来源排行最多显示几条
    stats-window-days: 7
    stats-source-limit: 8
    # 是否把本插件注册为 Vault 的经济提供者（需要服务器安装 Vault）。
    # 注册发生在插件的 onLoad 阶段，也就是所有插件 onEnable 之前，
    # 因此商店 / 职业 / 任务这类插件在启动时一定能查到经济服务。
    vault-hook: true
    # Vault 服务优先级：Lowest / Low / Normal / High / Highest。
    # 服务器上同时装了别的经济插件时，用它决定谁生效；
    # 想让本插件的经济压过其它插件就改成 Highest。
    vault-priority: Normal

  # ---------------- HuskTowns 对接 ----------------
  # 未安装 HuskTowns 时会自动跳过
  husktowns:
    enabled: true

  # ---------------- PlaceholderAPI 变量 ----------------
  # 未安装 PlaceholderAPI 时会自动跳过。
  # 变量清单见 README，例如 %ee_balance%、%ee_playtime%、%ee_afk_display%。
  papi:
    enabled: true
    # 除 %essentialengine_xxx% 外，是否再注册一份好写的短别名 %ee_xxx%
    short-alias: true
    # 余额排行榜变量（%ee_baltop_name_1% 等）缓存多少名、多少秒刷新一次。
    # 排行榜要查存储层，绝不能每次查询都读一遍，因此这里只用异步刷新的快照；
    # 想让排行榜更实时就把秒数调小，但不建议低于 30。
    baltop-size: 10
    baltop-cache-seconds: 60

  # ---------------- 网页管理面板 ----------------
  # 浏览器里查看服务器状态、改 config.yml、管理在线玩家。
  # 默认关闭；打开前请先设置 password，否则模块会拒绝启动。
  panel:
    enabled: false
    # 127.0.0.1 = 只允许本机访问（强烈推荐）。
    # 面板没有 HTTPS，密码是明文传输的，因此不要直接改成 0.0.0.0 暴露到公网；
    # 需要远程访问时请用 SSH 端口转发，或在前面套一层 Nginx 反代加 HTTPS：
    #   ssh -L 8193:127.0.0.1:8193 你的用户名@服务器地址
    # 然后在本地浏览器打开 http://127.0.0.1:8193
    bind-address: "127.0.0.1"
    port: 8193
    # 登录密码。留空则面板不会启动。
    # 也可以填 sha256 摘要，避免明文留在配置文件里，例如：
    #   password: "sha256:5e884898da28047151d0e56f8dc6292773603d0d6aabbdd62a11ef721d1542d8"
    password: ""
    # 登录后多久没有操作就要求重新登录（分钟）
    session-minutes: 120
    # 同一 IP 连续失败多少次后锁定，以及锁定时长（分钟）
    max-login-attempts: 5
    lockout-minutes: 10
    # 是否把每次面板请求打进控制台日志
    log-requests: false

    # ---- OAuth / OIDC 登录（可选）----
    # 用皮肤站等 OpenID Connect 身份源登录面板，不必再单独记面板密码。
    # 与密码登录可以共存：两个都配好时登录页会同时显示。
    # 配套的 provider 例如 EnderPass（Blessing Skin 皮肤站插件）。
    oauth:
      enabled: false
      # 身份源地址。填到域名即可，会自动拼 /.well-known/openid-configuration；
      # 也可以直接填完整的发现文档地址
      issuer: "https://skin.example.com"
      # 在身份源那边创建应用后获得
      client-id: ""
      client-secret: ""
      # 回调地址，必须和身份源里登记的完全一致。
      # 就是「面板地址 + /oauth/callback」，例如通过 SSH 隧道访问时：
      #   http://127.0.0.1:8193/oauth/callback
      redirect-uri: "http://127.0.0.1:8193/oauth/callback"
      # 必须包含 openid，否则身份源不会下发 id_token
      scopes: "openid profile"
      # 登录按钮上的文字
      button-text: "使用皮肤站账号登录"
      # 只允许身份源里的管理员登录（EnderPass 会下发 is_admin claim）。
      # 关掉的话，身份源里任何一个账号都能进面板——除非用下面的名单限定。
      require-admin: true
      # 精确指定放行哪些人：可以填角色名、游戏 UUID 或身份源的用户 ID。
      # 一旦填了，就以这份名单为准（require-admin 不再生效）。
      # 被身份源封禁的账号任何情况下都会被拒绝。
      allowed-users: []

  # ---------------- REST API ----------------
  # 给外部程序（QQ / Discord 机器人、网页后台、监控面板）调用的 HTTP 接口。
  # 默认关闭；开启前请务必修改 api-key，并尽量只监听 127.0.0.1。
  webapi:
    enabled: false
    # 0.0.0.0 = 所有网卡（公网可访问，风险高）；127.0.0.1 = 只允许本机访问
    bind-address: "127.0.0.1"
    port: 8192
    # 请改成一段足够随机的字符串，调用方需带 Authorization: Bearer <api-key>
    api-key: "change-me-to-a-random-key"
    # 是否把每次请求打进控制台日志
    log-requests: false
    # 允许通过 /api/server/command 执行的命令白名单，留空表示不限制（不建议）
    allowed-commands: []
    # 跨域来源。留空 = 不发 CORS 头，浏览器里的第三方页面就调不到本接口；
    # 服务端到服务端的调用（机器人、监控）不受影响，因为 CORS 只约束浏览器。
    # 需要网页前端直连时填具体来源，例如 "https://panel.example.com"；不建议填 "*"
    cors-origin: ""
