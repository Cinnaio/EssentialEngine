  usage: "{prefix}&eUsage: &f{usage}"
  player-not-found: "{prefix}&cPlayer not found: &f{player}"
  invalid-number: "{prefix}&cPlease provide a valid number."
  internal-error: "{prefix}&cSomething went wrong. Check the console for details."

