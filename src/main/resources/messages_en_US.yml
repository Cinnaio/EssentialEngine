# ============================================================
#  EssentialEngine - English language file
#
#  · Supports legacy colour codes (&a, &#FF00FF) and MiniMessage (<green>, <gradient:...>)
#  · {prefix} is replaced with general.prefix below
#  · Set a message to "" to silence it entirely
# ============================================================

general:
