# ============================================================
#  EssentialEngine 中文语言文件
#
#  · 支持传统颜色代码（&a、&#FF00FF）和 MiniMessage（<green>、<gradient:...>）
#  · {prefix} 会被替换成下面的 general.prefix
#  · 把某条消息的值改成空字符串 "" 即可让插件不再发送它
# ============================================================

general:
  prefix: "&8[&bEssentialEngine&8]&r "
  no-permission: "{prefix}&c你没有权限执行这个操作。 &8({permission})"
  player-only: "{prefix}&c这个命令只能由玩家执行。"
  usage: "{prefix}&e用法: &f{usage}"
  player-not-found: "{prefix}&c找不到玩家: &f{player}"
  invalid-number: "{prefix}&c请输入一个有效的数字。"
  internal-error: "{prefix}&c执行时发生错误，详情请查看控制台。"

core:
  reloaded: "{prefix}&a配置已重载，用时 {ms}ms。"
  saved: "{prefix}&a玩家数据已保存。"
  module-header: "{prefix}&b模块列表:"
  info-header: "{prefix}&bEssentialEngine &7v{version}"

teleport:
  cooldown: "{prefix}&c传送冷却中，还需等待 &f{time}&c。"
  warmup: "{prefix}&e请站在原地 &f{seconds} &e秒，移动会中断传送。"
  warmup-cancelled: "{prefix}&c传送已被中断。"
  teleported: "{prefix}&a传送完成。"
  world-not-loaded: "{prefix}&c目标世界未加载，无法传送。"
  world-not-loaded-named: "{prefix}&c目标世界 &f{world} &c未加载，无法传送。"

  invalid-name: "{prefix}&c名称不合法: &f{name} &7(只允许字母、数字、下划线、中文，最长 24 个字符)"

  no-homes: "{prefix}&c你还没有设置任何家，用 &f/sethome &c创建一个吧。"
  no-homes-of: "{prefix}&7{player} &c还没有设置任何家。"
  home-not-found: "{prefix}&c找不到名为 &f{name} &c的家。"
  home-set: "{prefix}&a已把 &f{name} &a设为你的家。"
  home-deleted: "{prefix}&a已删除家 &f{name}&a。"
  home-limit: "{prefix}&c你最多只能设置 &f{max} &c个家。"
  home-list: "{prefix}&b{player} 的家 &7({count}): &f{homes}"

  warp-not-found: "{prefix}&c找不到地标: &f{name}"
  warp-set: "{prefix}&a已创建地标 &f{name}&a。"
  warp-deleted: "{prefix}&a已删除地标 &f{name}&a。"
  warp-list: "{prefix}&b地标列表 &7({count}): &f{warps}"
  warp-sent: "{prefix}&a已把 &f{player} &a传送到地标 &f{name}&a。"
  no-warps: "{prefix}&7目前还没有任何地标。"

  spawn-not-set: "{prefix}&c出生点尚未设置。"
  spawn-set: "{prefix}&a出生点已设置为 &f{location}&a。"
  spawn-sent: "{prefix}&a已把 &f{player} &a送回出生点。"

  self: "{prefix}&c你不能对自己这么做。"
  request-sent: "{prefix}&a已向 &f{player} &a发送传送请求，60 秒内有效。"
  request-received: "{prefix}&f{player} &e想传送到你这里。 &a/tpaccept &7接受 &c/tpdeny &7拒绝"
  request-received-here: "{prefix}&f{player} &e希望你传送过去。 &a/tpaccept &7接受 &c/tpdeny &7拒绝"
  request-none: "{prefix}&c你现在没有待处理的传送请求。"
  request-expired: "{prefix}&c对方已经离线，请求失效。"
  request-accepted: "{prefix}&a已接受 &f{player} &a的传送请求。"
  request-accepted-target: "{prefix}&f{player} &a接受了你的传送请求。"
  request-denied: "{prefix}&c已拒绝该传送请求。"
  request-denied-target: "{prefix}&f{player} &c拒绝了你的传送请求。"
  request-cancelled: "{prefix}&a已取消 &f{count} &a条传送请求。"

  back-none: "{prefix}&c没有可返回的位置。"
  tp-success: "{prefix}&a已把 &f{player} &a传送到 &f{target}&a。"
  tp-target: "{prefix}&e你被 &f{player} &e传送了。"

  rtp-searching: "{prefix}&e正在寻找安全的落点……"
  rtp-failed: "{prefix}&c多次尝试后仍未找到安全落点，请稍后再试。"

player:
  healed: "{prefix}&a生命与饱食度已恢复。"
  healed-other: "{prefix}&a已治疗 &f{player}&a。"
  fed: "{prefix}&a饱食度已恢复。"
  fed-other: "{prefix}&a已喂饱 &f{player}&a。"
  fly-on: "{prefix}&a飞行已开启。"
  fly-on-other: "{prefix}&a已为 &f{player} &a开启飞行。"
  fly-off: "{prefix}&c飞行已关闭。"
  fly-off-other: "{prefix}&c已关闭 &f{player} &c的飞行。"
  god-on: "{prefix}&a无敌模式已开启。"
  god-on-other: "{prefix}&a已为 &f{player} &a开启无敌。"
  god-off: "{prefix}&c无敌模式已关闭。"
  god-off-other: "{prefix}&c已关闭 &f{player} &c的无敌。"
  speed-set: "{prefix}&a{type}速度已设为 &f{value}&a。"
  speed-set-other: "{prefix}&a已把 &f{player} &a的{type}速度设为 &f{value}&a。"
  speed-range: "{prefix}&c速度必须在 0 到 10 之间。"
  gamemode-set: "{prefix}&a游戏模式已切换为 &f{mode}&a。"
  gamemode-set-other: "{prefix}&a已把 &f{player} &a的游戏模式设为 &f{mode}&a。"
  gamemode-unknown: "{prefix}&c未知的游戏模式: &f{mode} &7(可用: survival/creative/adventure/spectator)"
  repaired: "{prefix}&a已修复 &f{count} &a件物品。"
  repair-nothing: "{prefix}&c没有可以修复的物品。"
  hat-set: "{prefix}&a已把手中的物品戴到头上。"
  hat-empty: "{prefix}&c你手上没有拿东西。"
  enderchest-opened: "{prefix}&a正在查看 &f{player} &a的末影箱。"
  suicide: "{prefix}&7再见……"
  near-none: "{prefix}&7{radius} 格内没有其他玩家。"
  near-list: "{prefix}&b{radius} 格内的玩家 &7({count}): &f{players}"
  ping: "{prefix}&f{player} &7的延迟: &a{ping}ms"
  playtime: "{prefix}&f{player} &7累计在线: &a{time}"

chat:
  message-self: "{prefix}&c你不能给自己发私聊。"
  no-reply-target: "{prefix}&c没有可回复的对象。"
  reply-target-offline: "{prefix}&c对方已经离线了。"
  target-ignoring: "{prefix}&c{player} 屏蔽了你的消息。"
  target-messages-off: "{prefix}&c{player} 当前不接收私聊。"
  target-afk: "{prefix}&7对方正处于离开状态，可能不会马上回复。"
  msgtoggle-on: "{prefix}&a已开启接收私聊。"
  msgtoggle-off: "{prefix}&c已关闭接收私聊。"
  socialspy-on: "{prefix}&a已开启私聊监听。"
  socialspy-off: "{prefix}&c已关闭私聊监听。"
  ignore-self: "{prefix}&c你不能屏蔽自己。"
  ignore-added: "{prefix}&a已屏蔽 &f{player}&a。"
  ignore-removed: "{prefix}&a已取消屏蔽 &f{player}&a。"
  nick-set: "{prefix}&a已把 &f{player} &a的昵称设为 &r{nick}&a。"
  nick-reset: "{prefix}&a已清除 &f{player} &a的昵称。"
  nick-too-long: "{prefix}&c昵称最长 {max} 个字符。"
  afk-on: "{prefix}&7你现在处于离开状态。"
  afk-off: "{prefix}&a欢迎回来。"
  afk-broadcast: "&7* {player} 暂时离开"
  afk-broadcast-reason: "&7* {player} 暂时离开 ({reason})"
  afk-return-broadcast: "&7* {player} 回来了"
  mail-cleared: "{prefix}&a邮箱已清空。"
  mail-sent: "{prefix}&a邮件已发送给 &f{player}&a。"
  mail-received: "{prefix}&e你收到了一封来自 &f{player} &e的邮件，输入 &f/mail &e查看。"
  mail-box-full: "{prefix}&c{player} 的邮箱已满。"
  mail-empty: "{prefix}&7你的邮箱是空的。"
  mail-header: "{prefix}&b你的邮件 &7({count} 封)"
  mail-entry: "&8 - &7[{time}] &f{sender}&8: &r{message}"

admin:
  default-reason: "未说明原因"
  kick-screen: "&c你已被踢出服务器\n&7原因: &f{reason}\n&7操作者: &f{operator}"
  kick-broadcast: "{prefix}&e{player} &7被 &f{operator} &7踢出服务器。 &8({reason})"
  ban-screen: "&c你已被封禁\n&7原因: &f{reason}\n&7时长: &f{duration}\n&7操作者: &f{operator}"
  ban-broadcast: "{prefix}&e{player} &7被 &f{operator} &7封禁 &f{duration}&7。 &8({reason})"
  target-exempt: "{prefix}&c{player} 免疫该操作。"
  invalid-duration: "{prefix}&c无法识别的时长: &f{input} &7(例如 30m、2h、7d、永久)"
  not-banned: "{prefix}&c{player} 并未被封禁。"
  unbanned: "{prefix}&a已解除 &f{player} &a的封禁。"
  muted: "{prefix}&a已禁言 &f{player} &f{duration}&a。 &8({reason})"
  muted-notify: "{prefix}&c你已被禁言 &f{duration}&c。\n&7原因: &f{reason}  &7操作者: &f{operator}"
  not-muted: "{prefix}&c{player} 并未被禁言。"
  unmuted: "{prefix}&a已解除 &f{player} &a的禁言。"
  unmuted-notify: "{prefix}&a你的禁言已被解除。"
  you-are-muted: "{prefix}&c你正在禁言中，剩余 &f{time}&c。 &8({reason})"
  vanish-on: "{prefix}&a你已隐身。"
  vanish-off: "{prefix}&c你已取消隐身。"
  vanish-on-other: "{prefix}&a已让 &f{player} &a隐身。"
  vanish-off-other: "{prefix}&c已取消 &f{player} &c的隐身。"
  vanish-still-on: "{prefix}&7提醒: 你仍处于隐身状态。"
  invsee-self: "{prefix}&c不能查看自己的背包。"
  inventory-cleared: "{prefix}&a背包已清空。"
  inventory-cleared-other: "{prefix}&a已清空 &f{player} &a的背包。"
  seen-online: "{prefix}&f{player} &a当前在线&7，累计游玩 &f{time}&7。"
  seen-offline: "{prefix}&f{player} &7最后在线: &f{time} &8({ago})"
  whois-header: "{prefix}&b{player} 的资料"

economy:
  balance-self: "{prefix}&7你的余额: &a{balance}"
  balance-other: "{prefix}&f{player} &7的余额: &a{balance}"
  amount-positive: "{prefix}&c金额必须大于 0。"
  amount-too-small: "{prefix}&c单次转账不能少于 {min}。"
  not-enough: "{prefix}&c余额不足，你当前只有 &f{balance}&c。"
  pay-self: "{prefix}&c不能给自己转账。"
  pay-sent: "{prefix}&a已向 &f{player} &a转账 &e{amount}&a。"
  pay-received: "{prefix}&a收到来自 &f{player} &a的 &e{amount}&a。"
  eco-done: "{prefix}&a{player} 的余额现在是 &e{balance}&a。"
  balance-changed: "{prefix}&e你的余额已变更为 &a{balance}&e。"
  baltop-empty: "{prefix}&7暂时还没有余额数据。"
  baltop-header: "{prefix}&b余额排行榜 &7(前 {count} 名)"
  baltop-entry: "&8 #{rank} &f{player} &7- &a{balance}"
  starting-balance: "{prefix}&a欢迎！已发放初始资金 &e{balance}&a。"
  kit-not-found: "{prefix}&c找不到套装: &f{name}"
  kit-once: "{prefix}&c套装 &f{name} &c每人只能领取一次。"
  kit-cooldown: "{prefix}&c套装 &f{name} &c冷却中，还需 &f{time}&c。"
  kit-empty: "{prefix}&c套装 &f{name} &c里没有任何物品。"
  kit-none: "{prefix}&7你目前没有可以领取的套装。"
  kit-list: "{prefix}&b可用套装 &7({count}): &f{kits}"
  kit-given: "{prefix}&a已领取套装 &f{name}&a。"
  kit-created: "{prefix}&a已用当前背包创建套装 &f{name}&a。"
  kit-deleted: "{prefix}&a已删除套装 &f{name}&a。"
  kit-reloaded: "{prefix}&a kits.yml 已重载。"
  kit-inventory-empty: "{prefix}&c背包是空的，无法创建套装。"

husktowns:
