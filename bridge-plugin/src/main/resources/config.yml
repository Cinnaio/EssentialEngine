# LinkEngine Configuration
# REST API bridge for Minecraft server management

api:
  # Port for the HTTP API server
  port: 8192
  # API key for authentication (CHANGE THIS!)
  api-key: "change-me-to-a-random-key"
  # Bind address (0.0.0.0 = all interfaces, 127.0.0.1 = localhost only)
  bind-address: "0.0.0.0"

modules:
  # Server core module - server status, commands, player info
  servercore:
    enabled: true
    # Whitelist of commands allowed via API (empty = all commands allowed)
    # Example: ["say", "tp", "gamemode"]
    allowed-commands: []

  # HuskTowns module - town management (requires HuskTowns plugin)
  husktowns:
    enabled: true
